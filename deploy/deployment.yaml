apiVersion: apps/v1
kind: Deployment
metadata:
  name: unimarc-sudoc-reconciler
  # ⚠️ À ADAPTER : ton namespace sur le SSP Cloud
  namespace: user-mhillion
  labels:
    app: unimarc-sudoc-reconciler
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector:
    matchLabels: { app: unimarc-sudoc-reconciler }
  template:
    metadata:
      labels: { app: unimarc-sudoc-reconciler }
    spec:
      containers:
        - name: app
          # ⚠️ À ADAPTER : l'image publiée par GitHub Actions.
          #
          # `latest` est une étiquette MOUVANTE : le workflow la recolle sur
          # l'image la plus récente à chaque push sur main. Conséquence à
          # connaître — ArgoCD compare le TEXTE de ce fichier à l'état du
          # cluster, or ce texte ne change jamais. Il ne redéploiera donc
          # rien de lui-même quand une nouvelle image est publiée, et le pod
          # continuera d'exécuter l'image téléchargée à son démarrage.
          #
          # La mise en production se fait donc à la main : bouton « Restart »
          # sur le Deployment dans l'interface ArgoCD. C'est un choix assumé
          # (voir README, « Mettre en production une nouvelle version »), qui
          # évite qu'un déploiement surprise n'efface les sessions de
          # vérification en cours — l'application n'a aucune persistance.
          #
          # Pour savoir si un redémarrage est nécessaire :
          # ./scripts/verifier-deploiement.sh
          image: ghcr.io/inseefrlab/unimarc-sudoc-reconciler:latest
          # Indispensable ici : sans cela, un pod recréé pourrait réutiliser
          # l'image déjà présente sur le nœud au lieu de retélécharger celle
          # que `latest` désigne maintenant — et le redémarrage ne servirait
          # à rien.
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
