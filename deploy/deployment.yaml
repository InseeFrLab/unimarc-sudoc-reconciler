apiVersion: apps/v1
kind: Deployment
metadata:
  name: unimarc-sudoc-reconciler
  # ⚠️ À ADAPTER : ton namespace sur le SSP Cloud
  namespace: user-mhillion
  labels:
    app: unimarc-sudoc-reconciler
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector:
    matchLabels: { app: unimarc-sudoc-reconciler }
  template:
    metadata:
      labels: { app: unimarc-sudoc-reconciler }
    spec:
      containers:
        - name: app
          # ⚠️ À ADAPTER : image épinglée par le SHA du commit à déployer.
          # Volontairement PAS `:latest` : ArgoCD compare le texte de ce fichier
          # à l'état du cluster, et un tag mouvant ne change jamais ce texte —
          # une nouvelle image ne serait donc jamais déployée. Épingler le SHA
          # fait de chaque mise en production un commit, qu'ArgoCD applique seul.
          # Procédure de mise à jour : voir le README, section « Déploiement ».
          image: ghcr.io/inseefrlab/unimarc-sudoc-reconciler:e48dca6cfb0752a71c4335076708b38a6f809ffd
          # Sans effet avec un tag épinglé (l'image est immuable), conservé pour
          # que le manifeste reste correct si quelqu'un revient à un tag mouvant.
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
