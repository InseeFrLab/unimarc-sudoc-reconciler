apiVersion: apps/v1
kind: Deployment
metadata:
  name: unimarc-sudoc-reconciler
  # ⚠️ À ADAPTER : ton namespace sur le SSP Cloud
  namespace: user-mhillion
  labels:
    app: unimarc-sudoc-reconciler
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector:
    matchLabels: { app: unimarc-sudoc-reconciler }
  template:
    metadata:
      labels: { app: unimarc-sudoc-reconciler }
    spec:
      containers:
        - name: app
          image: ghcr.io/inseefrlab/unimarc-sudoc-reconciler:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
