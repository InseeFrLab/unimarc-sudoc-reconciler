apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: unimarc-sudoc-reconciler
  # ⚠️ À ADAPTER : même namespace que le Deployment
  namespace: user-mhillion
  annotations:
    # Timeout long : la vérification d'un gros fichier peut occuper le
    # serveur plusieurs minutes (500 ms de pause par notice). Sans ça,
    # nginx couperait des requêtes au bout de 60 s.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: unimarc-sudoc-reconciler.lab.sspcloud.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: unimarc-sudoc-reconciler
                port: { number: 80 }
